<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EduMind</title>
    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="stylesheet" href="../styles/sesion.css">
</head>
<body>
    <div class="contenedor-sesion">
        <div class="card-sesion">
            <h1>Crear Cuenta</h1>
            <p class="subtitulo">Únete a EduMind y comienza a aprender</p>
            
            <form id="formRegistro">
                <div class="grupo-campos">
                    <div class="campo">
                        <label for="nombre">Nombre(s) *</label>
                        <input type="text" id="nombre" required>
                    </div>
                    
                    <div class="campo">
                        <label for="apellidoPaterno">Apellido Paterno *</label>
                        <input type="text" id="apellidoPaterno" required>
                    </div>
                </div>
                
                <div class="campo">
                    <label for="apellidoMaterno">Apellido Materno</label>
                    <input type="text" id="apellidoMaterno">
                </div>
                
                <div class="campo">
                    <label for="correo">Correo Electrónico *</label>
                    <input type="email" id="correo" required>
                </div>
                
                <div class="grupo-campos">
                    <div class="campo">
                        <label for="password">Contraseña *</label>
                        <input type="password" id="password" required minlength="8">
                        <small>Mínimo 8 caracteres</small>
                    </div>
                    
                    <div class="campo">
                        <label for="confirmarPassword">Confirmar Contraseña *</label>
                        <input type="password" id="confirmarPassword" required>
                    </div>
                </div>
                
                <div class="grupo-campos">
                    <div class="campo">
                        <label for="fechaNacimiento">Fecha de Nacimiento *</label>
                        <input type="date" id="fechaNacimiento" required>
                    </div>
                    
                    <div class="campo">
                        <label for="nivelConocimiento">Nivel de Conocimiento *</label>
                        <select id="nivelConocimiento" required>
                            <option value="basico">Básico</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                    </div>
                </div>
                
                <div class="campo">
                    <label for="matricula">Matrícula (opcional)</label>
                    <input type="text" id="matricula">
                </div>
                
                <div id="mensajeError" class="mensaje error" style="display: none;"></div>
                <div id="mensajeExito" class="mensaje exito" style="display: none;"></div>
                
                <button type="submit" class="btn-principal" id="btnRegistro">
                    Registrarse
                </button>
            </form>
            
            <p class="texto-alterno">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
            
            <a href="inicio.html" class="link-volver">← Volver al inicio</a>
        </div>
    </div>
    
    <script src="../src/config.js"></script>  
    <script src="../src/auth/registro.js"></script>
</body>
</html>
