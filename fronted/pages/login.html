<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EduMind</title>
    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="stylesheet" href="../styles/sesion.css">
</head>
<body>
    <div class="contenedor-sesion">
        <div class="card-sesion">
            <h1>Iniciar Sesión</h1>
            <p class="subtitulo">Bienvenido de vuelta a EduMind</p>
            
            <form id="formLogin">
                <div class="campo">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" required autocomplete="email">
                </div>
                
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                
                <div id="mensajeError" class="mensaje error" style="display: none;"></div>
                
                <button type="submit" class="btn-principal" id="btnLogin">
                    Iniciar Sesión
                </button>
            </form>
            
            <div class="enlaces">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            
            <p class="texto-alterno">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
            
            <a href="inicio.html" class="link-volver">← Volver al inicio</a>
        </div>
    </div>
    
    <script src="../src/auth/login.js"></script>
</body>
</html>
